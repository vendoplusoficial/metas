<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Metas de Ahorro</title>
<meta name="theme-color" content="#09090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
:root{
  /* Layout: una sola columna tipo iPhone. Pantallas apiladas con navegación lateral y hojas que suben desde abajo. */
  --bg:#09090a;
  --surface:#141416;
  --surface-2:#1c1c1f;
  --surface-3:#2a2a2e;
  --line:#232326;
  --line-2:#323237;
  --text:#f4f4f6;
  --text-2:#c7c7cc;
  --muted:#8b8b91;
  --faint:#5a5a60;
  --ink:#0b0b0c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Geist",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Geist",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono",ui-monospace,"Geist Mono",Menlo,Consolas,monospace;
  --r-card:10px;
  --r-ctrl:9px;
  --r-sheet:14px;
  --ease:cubic-bezier(.32,.72,0,1);
  --ease-out:cubic-bezier(.23,1,.32,1);
  --nav-h:52px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
input{font:inherit;color:inherit;margin:0}
h1,h2,p{margin:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Contenedor de la app */
.app{position:fixed;inset:0;margin:0 auto;max-width:480px;overflow:hidden;background:#000}
@media (min-width:520px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.stack{position:absolute;inset:0;overflow:hidden;background:var(--bg);transform-origin:50% 0;transition:transform .5s var(--ease),border-radius .5s var(--ease)}
.app.sheet-open .stack{transform:translateY(calc(env(safe-area-inset-top,0px) + 10px)) scale(.94);border-radius:12px}

/* Pantallas */
.screen{position:absolute;inset:0;background:var(--bg);transform:translate3d(100%,0,0);transition:transform .5s var(--ease),opacity .4s var(--ease-out);will-change:transform;box-shadow:-12px 0 32px rgba(0,0,0,.45);touch-action:pan-y}
.screen::after{content:"";position:absolute;inset:0;background:#000;opacity:var(--dim,0);pointer-events:none;transition:opacity .5s var(--ease);z-index:5}
.screen.active{transform:none}
.screen.behind{transform:translate3d(-30%,0,0);--dim:.45;pointer-events:none}
.screen.entering{opacity:0;transform:scale(.985);transition:none}
.screen.leaving{opacity:0;pointer-events:none}
.screen.dragging,.screen.dragging::after{transition:none}

.nav{position:absolute;top:0;left:0;right:0;z-index:3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:env(safe-area-inset-top,0px) 10px 0;height:calc(env(safe-area-inset-top,0px) + var(--nav-h));background:rgba(9,9,10,.8);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px);border-bottom:1px solid transparent;transition:border-color .25s}
.nav.scrolled{border-bottom-color:var(--line)}
.nav-left{justify-self:start;min-width:0}
.nav-right{justify-self:end;min-width:0}
.nav-title{font:600 17px/1.2 var(--font);max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(5px);transition:opacity .25s,transform .35s var(--ease-out)}
.nav.scrolled .nav-title{opacity:1;transform:none}
.nav-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 8px;border-radius:8px;font-size:17px;color:var(--text);transition:opacity .15s}
.nav-btn:active{opacity:.45}

.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + var(--nav-h)) 20px calc(env(safe-area-inset-bottom,0px) + 48px)}
.large{font:700 34px/1.12 var(--font-display);letter-spacing:-.022em;margin-top:6px;text-wrap:balance;overflow-wrap:anywhere}
.muted-p{color:var(--muted);font-size:16px;line-height:1.45;margin-top:8px;max-width:34ch}
.eyebrow{font:600 12px/1 var(--font);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.section{margin-top:34px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px;min-height:22px}
.count{font:500 13px var(--font-mono);color:var(--faint)}
.link{font-size:15px;font-weight:500;color:var(--text);padding:4px 0;transition:opacity .15s}
.link:active{opacity:.45}

/* Botones */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;padding:0 18px;border-radius:var(--r-ctrl);font:600 16px/1 var(--font);letter-spacing:-.005em;transition:transform .22s var(--ease-out),background-color .2s,color .2s,border-color .2s,opacity .2s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn-primary{background:var(--text);color:var(--ink)}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line-2)}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--line-2)}
.btn.armed{background:var(--text);color:var(--ink);border-color:var(--text)}
.btn-sm{height:42px;font-size:15px}
@media (hover:hover){
  .btn-primary:hover:not(:disabled){background:#fff}
  .btn-secondary:hover:not(:disabled),.btn-ghost:hover:not(:disabled){background:var(--surface-3)}
  .goal:hover{background:var(--surface-2)}
  button.row:hover{background:var(--surface-2)}
}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Campos */
.form{display:grid;gap:16px}
.field{display:grid;gap:8px;min-width:0}
.field>label{font:500 13px/1 var(--font);color:var(--muted);padding-left:2px}
.input{width:100%;height:52px;padding:0 14px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-ctrl);font-size:17px;-webkit-appearance:none;appearance:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
.input::placeholder{color:var(--faint)}
.input:focus{border-color:#77777d;box-shadow:0 0 0 4px rgba(255,255,255,.06);background:#202023}
.input-wrap{position:relative;min-width:0}
.input-wrap .prefix,.input-wrap .suffix{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:17px}
.input-wrap .prefix{left:14px}
.input-wrap .suffix{right:14px}
.input.has-prefix{padding-left:30px}
.input.has-suffix{padding-right:34px}
.input.has-unit{padding-right:62px}
.input-amount{height:66px;font:600 30px/1 var(--font-display);letter-spacing:-.02em}
.input-amount+.unit,.unit{font:500 13px var(--font-mono)!important;letter-spacing:.04em}
.input-wrap .prefix.big{font:600 30px/1 var(--font-display);color:var(--muted);left:14px}
.input.input-amount.has-prefix{padding-left:36px}
.hint{font-size:13px;color:var(--muted);line-height:1.45;padding-left:2px}
.err{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-2);border-left:3px solid var(--text);border-radius:8px;background:var(--surface-2);font-size:14px;line-height:1.4;color:var(--text)}
.err svg{flex:none;margin-top:1px}

/* Inicio */
.summary{display:grid;gap:6px;margin-top:22px}
.summary-amount{font:700 42px/1.05 var(--font-display);letter-spacing:-.035em}
.summary-sub{color:var(--muted);font-size:15px}
.create-btn{margin-top:24px}
.list{display:grid;gap:10px}
.goal{display:grid;gap:14px;width:100%;text-align:left;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);transition:transform .25s var(--ease-out),background-color .2s}
.goal:active{transform:scale(.98);background:var(--surface-2)}
.goal-top{display:flex;align-items:center;gap:10px}
.goal-name{flex:1;min-width:0;font:600 17px/1.3 var(--font);overflow-wrap:anywhere}
.chev{color:var(--faint);flex:none;display:flex}
.goal-figs{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.goal-figs>div{min-width:0}
.goal-saved{font:600 22px/1 var(--font-display);letter-spacing:-.02em}
.goal-of{color:var(--muted);font-size:14px;margin-left:4px}
.goal-pct{font:500 13px var(--font-mono);color:var(--text-2);flex:none}
.bar{height:4px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--text);border-radius:inherit;transition:width .9s var(--ease)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:6px;font:600 12px/1 var(--font);letter-spacing:.02em;flex:none;background:var(--text);color:var(--ink)}
.empty{display:grid;gap:16px;padding:20px 18px;border:1px dashed var(--line-2);border-radius:var(--r-card);color:var(--muted);font-size:15px;line-height:1.45}
.empty strong{display:block;color:var(--text);font-weight:600;margin-bottom:4px;font-size:16px}

/* Detalle de meta */
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.title-row .pill{margin-top:14px}
.hero{margin-top:26px}
.hero-amount{font:700 50px/1 var(--font-display);letter-spacing:-.04em;margin-top:12px;overflow-wrap:anywhere}
.hero-of{color:var(--muted);margin-top:8px;font-size:16px}
.bar-lg{height:6px;border-radius:3px;margin-top:22px}
.hero-meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;color:var(--muted);font-size:14px}
.hero-meta span:first-child{color:var(--text-2)}
.actions-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.actions-2 .btn{padding:0 10px;font-size:15px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:12px 16px;text-align:left;transition:background-color .15s}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
button.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-title{font-size:16px;line-height:1.3;overflow-wrap:anywhere}
.row-sub{color:var(--muted);font-size:13px;margin-top:3px}
.row-right{text-align:right;flex:none}
.row-val{font:600 16px var(--font);white-space:nowrap}
.row-val.neg{color:var(--muted);font-weight:500}
.row-k{color:var(--muted);font-size:15px;flex:none}
.row-v{font-size:15px;text-align:right;min-width:0;overflow-wrap:anywhere;flex:1}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}
.sw-empty{background:none;border:1px dashed var(--faint)}
.split{display:flex;gap:2px;height:10px;border-radius:3px;overflow:hidden;background:var(--surface-3);margin-bottom:12px;transform-origin:0 50%}
.split i{display:block;height:100%;flex:0 0 0%;transition:flex-basis .5s var(--ease)}
.split-lg{height:12px;margin:0}
.rest .row-title,.rest .row-val{color:var(--muted)}
.skeleton{height:58px;border-radius:var(--r-card);background:var(--surface);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.detail-amount{font:700 40px/1 var(--font-display);letter-spacing:-.035em;padding:6px 0 4px}

/* Dividir meta */
.alloc-list{display:grid}
.alloc-item{display:grid;gap:8px;padding-bottom:14px}
.alloc-row{display:grid;grid-template-columns:minmax(0,1fr) 92px 44px;gap:8px;align-items:center}
.alloc-calc{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding-left:2px}
.alloc-total{display:flex;justify-content:space-between;gap:12px;padding:14px 2px 0;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.alloc-total strong{color:var(--text);font-weight:600}
.alloc-total.over strong{text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface-2);color:var(--text-2);flex:none;transition:transform .2s var(--ease-out),background-color .2s}
.icon-btn:active{transform:scale(.9)}
.icon-btn-lg{width:44px;height:52px;border:1px solid var(--line-2)}

/* Hoja inferior */
.sheet-layer{position:absolute;inset:0;z-index:20;visibility:hidden;pointer-events:none;transition:visibility 0s linear .5s}
.sheet-layer.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .45s var(--ease)}
.sheet-layer.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:var(--kb,0px);max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line-2);border-radius:var(--r-sheet) var(--r-sheet) 0 0;transform:translate3d(0,105%,0);transition:transform .5s var(--ease),bottom .25s var(--ease-out);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet-layer.open .sheet{transform:none}
.sheet.dragging{transition:none}
.sheet-grab{flex:none;touch-action:none;cursor:grab}
.grabber{width:38px;height:5px;border-radius:3px;background:var(--surface-3);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 8px}
.sheet-head h2{font:700 21px/1.2 var(--font-display);letter-spacing:-.015em;min-width:0;overflow-wrap:anywhere}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:12px 20px 24px}
.sheet-text{color:var(--muted);font-size:14px;line-height:1.5}
.sheet-text b{color:var(--text-2);font-weight:600}

/* Control segmentado */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;height:38px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px}
.seg-thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:7px;background:var(--surface-3);box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .38s var(--ease)}
.seg[data-v="expense"] .seg-thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;font:600 14px var(--font);color:var(--muted);transition:color .25s}
.seg button[aria-selected="true"]{color:var(--text)}

/* Aviso flotante */
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:40;max-width:calc(100% - 32px);padding:11px 16px;border-radius:10px;background:var(--text);color:var(--ink);font:600 14px/1.3 var(--font);box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translate(-50%,160%);opacity:0;transition:transform .5s var(--ease),opacity .3s;pointer-events:none;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="stack" id="stack"></div>
  <div class="sheet-layer" id="sheet">
    <div class="backdrop" data-sheet-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grab">
        <div class="grabber"></div>
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button class="icon-btn" type="button" data-sheet-close aria-label="Cerrar">
            <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="m2 2 8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
'use strict';

/* ==========================================================================
   UTILIDADES
   ========================================================================== */
class AppError extends Error {}
const r2 = (n) => Math.round(Number(n) * 100) / 100;
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
const sumMovements = (list) => r2(list.reduce((s, m) => s + (m.type === 'income' ? 1 : -1) * Number(m.amount), 0));
const msgOf = (e) => (e instanceof AppError) ? e.message : 'Algo salió mal. Inténtalo de nuevo.';

/* ==========================================================================
   DATOS (se guardan en este navegador)
   ========================================================================== */
function createStore() {
  const KEY = 'metas-ahorro.v1';
  let persistent = true;
  let db = null;
  try {
    const raw = localStorage.getItem(KEY);
    db = raw ? JSON.parse(raw) : null;
    localStorage.setItem(KEY + '.probe', '1');
    localStorage.removeItem(KEY + '.probe');
  } catch (e) { persistent = false; }
  if (!db || typeof db !== 'object') db = {};
  const clean = (list) => (Array.isArray(list) ? list : []).map(({ user_id, ...rest }) => rest);
  db = { goals: clean(db.goals), movements: clean(db.movements), allocations: clean(db.allocations) };

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { persistent = false; } };
  const now = () => new Date().toISOString();
  const find = (list, id) => {
    const x = list.find((r) => r.id === id);
    if (!x) throw new AppError('No encontramos ese registro.');
    return x;
  };
  save();

  return {
    get persistent() { return persistent; },
    goals: {
      async list() {
        return db.goals.slice()
          .sort((a, b) => b.created_at.localeCompare(a.created_at))
          .map((g) => ({ id: g.id, name: g.name, target: g.target, created_at: g.created_at,
            saved: sumMovements(db.movements.filter((m) => m.goal_id === g.id)) }));
      },
      async create({ name, target }) {
        const g = { id: uuid(), name: name.trim(), target: r2(target), created_at: now() };
        db.goals.push(g); save();
        return { ...g, saved: 0 };
      },
      async update(id, patch) {
        const g = find(db.goals, id);
        if (patch.name != null) g.name = patch.name.trim();
        if (patch.target != null) g.target = r2(patch.target);
        save();
      },
      async remove(id) {
        find(db.goals, id);
        db.goals = db.goals.filter((g) => g.id !== id);
        db.movements = db.movements.filter((m) => m.goal_id !== id);
        db.allocations = db.allocations.filter((a) => a.goal_id !== id);
        save();
      },
    },
    movements: {
      async list(goalId) {
        return db.movements.filter((m) => m.goal_id === goalId)
          .sort((a, b) => b.created_at.localeCompare(a.created_at)).map((m) => ({ ...m }));
      },
      async create(goalId, { type, amount, concept }) {
        find(db.goals, goalId);
        const m = { id: uuid(), goal_id: goalId, type, amount: r2(amount), concept: (concept || '').trim(), created_at: now() };
        db.movements.push(m); save();
        return { ...m };
      },
      async remove(id) {
        find(db.movements, id);
        db.movements = db.movements.filter((m) => m.id !== id);
        save();
      },
    },
    allocations: {
      async list(goalId) {
        return db.allocations.filter((a) => a.goal_id === goalId)
          .sort((a, b) => a.position - b.position).map((a) => ({ ...a }));
      },
      async replace(goalId, items) {
        find(db.goals, goalId);
        const total = items.reduce((s, i) => s + Number(i.percent), 0);
        if (total > 100.0001) throw new AppError('La suma de porcentajes no puede pasar de 100%.');
        db.allocations = db.allocations.filter((a) => a.goal_id !== goalId);
        items.forEach((it, i) => db.allocations.push({ id: uuid(), goal_id: goalId,
          label: it.label.trim(), percent: r2(it.percent), position: i, created_at: now() }));
        save();
        return this.list(goalId);
      },
    },
  };
}

/* ==========================================================================
   FORMATO
   ========================================================================== */
const fmt0 = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
const fmt2 = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function money(n) {
  const v = r2(Number(n) || 0);
  return (Number.isInteger(v) ? fmt0 : fmt2).format(v).replace('-', '−');

function openCreateGoal(onDone) {
  const f = h(`<form class="form" novalidate>

    <button class="btn btn-primary" type="submit">Crear meta</button>
  </form>`);
  bindMoney(f.querySelector('#g-target'));
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErr(f);
    const name = f.querySelector('#g-name').value.trim();
    const target = readMoney(f.querySelector('#g-target'));
    if (!name) return showErr(f, 'Ponle un nombre a la meta.');
    if (target <= 0) return showErr(f, 'Escribe el monto que quieres juntar.');
    const btn = f.querySelector('[type="submit"]');
    setLoading(btn, true);
    try {
      const g = await api.goals.create({ name, target });
      await loadGoals();
      sheet.close();
      setTimeout(() => { onDone(g.id); toast('Meta creada'); }, 180);
    } catch (err) { setLoading(btn, false); showErr(f, msgOf(err)); }
  });
  sheet.open({ title: 'Nueva meta', content: f });
}

      <div class="group">
        ${allocations.map((a, i) => `<div class="row">
          <span class="sw" style="background:${shade(i)}"></span>
          <div class="row-main"><div class="row-title">${esc(a.label)}</div><div class="row-sub num">${fmtPct(a.percent)} · ${money(goal.target * a.percent / 100)} al completar</div></div>
          <div class="row-right"><div class="row-val num">${money(saved * a.percent / 100)}</div></div>
        </div>`).join('')}
        ${rest > 0 ? `<div class="row rest"><span class="sw sw-empty"></span><div class="row-main"><div class="row-title">Sin asignar</div><div class="row-sub num">${fmtPct(rest)} · ${money(goal.target * rest / 100)} al completar</div></div><div class="row-right"><div class="row-val num">${money(saved * rest / 100)}</div></div></div>` : ''}
      </div>`;
    if (fresh) anim(host.querySelector('.split'), [{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 800, delay: 150 });
  }

  function renderMoves(newId) {
    const host = q('[data-moves]');
    if (!movements) return;
    q('[data-mcount]').textContent = movements.length ? String(movements.length) : '';
    if (!movements.length) {
      host.innerHTML = '<div class="empty"><div><strong>Sin movimientos</strong>Agrega dinero cuando ahorres y registra los gastos que salgan de esta meta.</div></div>';
      return;
    }
    host.innerHTML = `<div class="group">${movements.map((m) => {
      const inc = m.type === 'income';
      return `<button class="row" type="button" data-mid="${esc(m.id)}">
        <div class="row-main"><div class="row-title">${esc(m.concept || (inc ? 'Ingreso' : 'Gasto'))}</div><div class="row-sub">${inc ? 'Ingreso' : 'Gasto'} · ${when(m.created_at)}</div></div>
        <div class="row-val num ${inc ? '' : 'neg'}">${inc ? '+' : '−'}${money(m.amount)}</div>
      </button>`;
    }).join('')}</div>`;
    if (newId) {
      const r = host.querySelector(`[data-mid="${CSS.escape(newId)}"]`);
      if (r) anim(r, [{ opacity: 0, transform: 'translateY(-8px)', background: 'var(--surface-3)' }, { opacity: 1, transform: 'none', background: 'transparent' }], { duration: 700 });
    }
  }

  async function reload(newMoveId) {
    await loadGoals();
    goal = state.goals.find((g) => g.id === id);
    if (!goal) { nav.pop(); return; }
    [movements, allocations] = await Promise.all([api.movements.list(id), api.allocations.list(id)]);
    renderHero(); renderAlloc(false); renderMoves(newMoveId);
  }

  el.addEventListener('click', (e) => {
    const m = e.target.closest('[data-mid]');
    if (m) {
      const mv = movements.find((x) => x.id === m.dataset.mid);
      if (mv) openMovementDetail(mv, () => reload());
      return;
    }
    const a = e.target.closest('[data-a]');
    if (!a) return;
    const act = a.dataset.a;
    if (act === 'income' || act === 'expense') openMovement(goal, act, (newId) => reload(newId));
    if (act === 'split' && allocations) openSplit(goal, allocations, () => reload());
    if (act === 'edit') openEditGoal(goal, { onSaved: () => reload(), onDeleted: () => { nav.pop(); setTimeout(() => toast('Meta eliminada'), 300); } });
  });

  return {
    el,
    async onShow() {
      renderHero();
      try {
        [movements, allocations] = await Promise.all([api.movements.list(id), api.allocations.list(id)]);
        renderAlloc(true); renderMoves();
        [q('[data-alloc]'), q('[data-moves]')].forEach((n, i) => anim(n, [{ opacity: 0 }, { opacity: 1 }], { duration: 400, delay: i * 60 }));
      } catch (err) { toast(msgOf(err)); }
    },
  };
}

function openMovement(goal, type, onSaved) {
  let t = type;
  const f = h(`<form class="form" novalidate>
    <div class="seg" role="tablist" aria-label="Tipo de movimiento"><span class="seg-thumb"></span><button type="button" role="tab" data-t="income">Ingreso</button><button type="button" role="tab" data-t="expense">Gasto</button></div>
    <div class="field"><label for="m-amount">Monto</label>${moneyField('m-amount')}</div>
    <div class="field"><label for="m-concept">Concepto</label><input class="input" id="m-concept" maxlength="80" autocomplete="off"></div>
    <p class="hint" data-hint hidden></p>
    <div class="err" hidden></div>
    <button class="btn btn-primary" type="submit" data-submit></button>
  </form>`);
  const seg = f.querySelector('.seg');
  const amount = f.querySelector('#m-amount');
  const concept = f.querySelector('#m-concept');
  const hint = f.querySelector('[data-hint]');
  bindMoney(amount);
  function sync() {
    seg.dataset.v = t;
    seg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.t === t)));
    concept.placeholder = t === 'income' ? 'Ej. Quincena, venta, ahorro semanal' : 'Ej. Refacción, mano de obra';
    f.querySelector('[data-submit]').textContent = t === 'income' ? 'Agregar dinero' : 'Registrar gasto';
    sheet.setTitle(t === 'income' ? 'Agregar dinero' : 'Registrar gasto');
    checkHint();
  }
  function checkHint() {
    const v = readMoney(amount);
    const show = t === 'expense' && v > 0 && v > goal.saved;
    hint.hidden = !show;
    if (show) hint.textContent = `Este gasto es mayor a lo ahorrado (${money(goal.saved)}). La meta quedará en negativo.`;
  }
  seg.addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b && b.dataset.t !== t) { t = b.dataset.t; sync(); } });
  amount.addEventListener('input', checkHint);
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErr(f);
    const v = readMoney(amount);
    if (v <= 0) return showErr(f, 'Escribe un monto mayor a cero.');
    const btn = f.querySelector('[data-submit]');
    setLoading(btn, true);
    try {
      const m = await api.movements.create(goal.id, { type: t, amount: v, concept: concept.value });
      sheet.close();
      onSaved(m.id);
      toast(t === 'income' ? 'Agregaste ' + money(v) : 'Gasto registrado');
    } catch (err) { setLoading(btn, false); showErr(f, msgOf(err)); }
  });
  sheet.open({ title: '', content: f });
  sync();
}

function openMovementDetail(m, onDeleted) {
  const inc = m.type === 'income';
  const c = h(`<div class="form">
    <div class="detail-amount num">${inc ? '+' : '−'}${money(m.amount)}</div>
    <div class="group">
      <div class="row"><span class="row-k">Tipo</span><span class="row-v">${inc ? 'Ingreso' : 'Gasto'}</span></div>
      <div class="row"><span class="row-k">Concepto</span><span class="row-v">${esc(m.concept || 'Sin concepto')}</span></div>
      <div class="row"><span class="row-k">Fecha</span><span class="row-v">${esc(dLong.format(new Date(m.created_at)))}</span></div>
    </div>
    <div class="err" hidden></div>
    <button class="btn btn-ghost" type="button" data-del>Eliminar movimiento</button>
  </div>`);
  twoTap(c.querySelector('[data-del]'), 'Toca otra vez para eliminar', async (btn) => {
    setLoading(btn, true);
    try { await api.movements.remove(m.id); sheet.close(); onDeleted(); toast('Movimiento eliminado'); }
    catch (err) { setLoading(btn, false); showErr(c, msgOf(err)); }
  });
  sheet.open({ title: 'Movimiento', content: c });
}

function openEditGoal(goal, { onSaved, onDeleted }) {
  const f = h(`<form class="form" novalidate>
    <div class="field"><label for="e-name">Nombre</label><input class="input" id="e-name" maxlength="60" autocomplete="off"></div>
    <div class="field"><label for="e-target">Monto de la meta</label>${moneyField('e-target')}</div>
    <div class="err" hidden></div>
    <button class="btn btn-primary" type="submit">Guardar cambios</button>
    <button class="btn btn-ghost" type="button" data-del>Eliminar meta</button>
    <p class="hint">Al eliminarla se borran también sus movimientos y su división.</p>
  </form>`);
  const name = f.querySelector('#e-name'), target = f.querySelector('#e-target');
  name.value = goal.name;
  target.value = plain(goal.target);
  bindMoney(target);
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErr(f);
    const n = name.value.trim(), t = readMoney(target);
    if (!n) return showErr(f, 'Ponle un nombre a la meta.');
    if (t <= 0) return showErr(f, 'Escribe el monto que quieres juntar.');
    const btn = f.querySelector('[type="submit"]');
    setLoading(btn, true);
    try { await api.goals.update(goal.id, { name: n, target: t }); sheet.close(); onSaved(); toast('Cambios guardados'); }
    catch (err) { setLoading(btn, false); showErr(f, msgOf(err)); }
  });
  twoTap(f.querySelector('[data-del]'), 'Toca otra vez para eliminar', async (btn) => {
    setLoading(btn, true);
    try { await api.goals.remove(goal.id); await loadGoals(); sheet.close(); onDeleted(); }
    catch (err) { setLoading(btn, false); showErr(f, msgOf(err)); }
  });
  sheet.open({ title: 'Editar meta', content: f });
}

function openSplit(goal, current, onSaved) {
  const saved = Math.max(0, goal.saved), target = goal.target;
  let key = 0;
  let rows = (current.length ? current : [{ label: '', percent: '' }])
    .map((a) => ({ k: key++, label: a.label || '', percent: a.percent === '' || a.percent == null ? '' : String(a.percent) }));
  const f = h(`<form class="form" novalidate>
    <p class="sheet-text">Asigna un porcentaje a cada destino. Los montos se calculan sobre lo que llevas (<b class="num">${money(saved)}</b>) y sobre la meta completa (<b class="num">${money(target)}</b>).</p>
    <div class="split split-lg" data-preview></div>
    <div class="alloc-list" data-rows></div>
    <button class="btn btn-secondary btn-sm" type="button" data-add>${ICON.plus}<span>Agregar parte</span></button>
    <div class="alloc-total num" data-total></div>
    <div class="err" hidden></div>
    <button class="btn btn-primary" type="submit" data-save>Guardar división</button>
  </form>`);
  const list = f.querySelector('[data-rows]');
  const preview = f.querySelector('[data-preview]');

  function rowEl(r) {
    const e = h(`<div class="alloc-item" data-k="${r.k}">
      <div class="alloc-row">
        <input class="input" id="al-l-${r.k}" maxlength="40" autocomplete="off" placeholder="Ej. Al banco" aria-label="Destino">
        <div class="input-wrap"><input class="input has-suffix num" id="al-p-${r.k}" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Porcentaje"><span class="suffix">%</span></div>
        <button class="icon-btn icon-btn-lg" type="button" data-rm aria-label="Quitar parte">${ICON.close}</button>
      </div>
      <div class="alloc-calc num" data-calc></div>
    </div>`);
    const [l, p] = e.querySelectorAll('input');
    l.value = r.label; p.value = r.percent;
    l.addEventListener('input', () => { r.label = l.value; update(); });
    p.addEventListener('input', () => { p.value = cleanPct(p.value); r.percent = p.value; update(); });
    e.querySelector('[data-rm]').addEventListener('click', () => {
      rows = rows.filter((x) => x !== r);
      e.style.overflow = 'hidden';
      const a = anim(e, [{ height: e.offsetHeight + 'px', opacity: 1 }, { height: '0px', opacity: 0, paddingBottom: '0px' }], { duration: 320, fill: 'forwards' });
      if (a) a.onfinish = () => e.remove(); else e.remove();
      update();
    });
    return e;
  }

  function update() {
    const total = r2(rows.reduce((s, r) => s + (parseFloat(r.percent) || 0), 0));
    rows.forEach((r, i) => {
      const e = list.querySelector(`[data-k="${r.k}"]`);
      if (!e) return;
      const p = parseFloat(r.percent) || 0;
      e.querySelector('[data-calc]').innerHTML = p
        ? `<span class="sw" style="background:${shade(i)}"></span><span>${money(saved * p / 100)} hoy · ${money(target * p / 100)} al completar</span>`
        : '<span class="sw sw-empty"></span><span>Escribe un porcentaje</span>';
    });
    const keys = new Set(rows.map((r) => String(r.k)));
    [...preview.children].forEach((c) => { if (!keys.has(c.dataset.k)) c.remove(); });
    rows.forEach((r, i) => {
      let seg = preview.querySelector(`[data-k="${r.k}"]`);
      if (!seg) { seg = document.createElement('i'); seg.dataset.k = r.k; preview.appendChild(seg); }
      seg.style.background = shade(i);
      void seg.offsetWidth;
      seg.style.flexBasis = Math.min(100, parseFloat(r.percent) || 0) + '%';
    });
    const box = f.querySelector('[data-total]');
    const over = total > 100;
    box.classList.toggle('over', over);
    box.innerHTML = over
      ? `<span>Te pasas por <strong>${fmtPct(total - 100)}</strong></span><span>Asignado <strong>${fmtPct(total)}</strong></span>`
      : `<span>Asignado <strong>${fmtPct(total)}</strong></span><span>Sin asignar <strong>${fmtPct(100 - total)}</strong></span>`;
    f.querySelector('[data-save]').disabled = over;
  }

  rows.forEach((r) => list.appendChild(rowEl(r)));
  f.querySelector('[data-add]').addEventListener('click', () => {
    const r = { k: key++, label: '', percent: '' };
    rows.push(r);
    const e = rowEl(r);
    list.appendChild(e);
    anim(e, [{ opacity: 0, transform: 'translateY(-6px)' }, { opacity: 1, transform: 'none' }], { duration: 380 });
    update();
    e.querySelector('input').focus({ preventScroll: false });
  });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErr(f);
    const items = rows.filter((r) => r.label.trim() || parseFloat(r.percent));
    if (items.some((r) => !r.label.trim())) return showErr(f, 'Ponle nombre a cada parte.');
    if (items.some((r) => !(parseFloat(r.percent) > 0))) return showErr(f, 'Cada parte necesita un porcentaje mayor a 0.');
    if (items.reduce((s, r) => s + parseFloat(r.percent), 0) > 100.0001) return showErr(f, 'La suma no puede pasar de 100%.');
    const btn = f.querySelector('[data-save]');
    setLoading(btn, true);
    try {
      await api.allocations.replace(goal.id, items.map((r) => ({ label: r.label, percent: parseFloat(r.percent) })));
      sheet.close();
      onSaved();
      toast(items.length ? 'División guardada' : 'División eliminada');
    } catch (err) { setLoading(btn, false); showErr(f, msgOf(err)); }
  });
  sheet.open({ title: 'Dividir meta', content: f });
  requestAnimationFrame(update);
}

/* ==========================================================================
   ARRANQUE
   ========================================================================== */
async function boot() {
  try { await loadGoals(); }
  catch (e) { state.goals = []; setTimeout(() => toast(msgOf(e)), 900); }
  nav.root(HomeScreen());
  if (!api.persistent) setTimeout(() => toast('Este navegador no permite guardar. Tus datos se perderán al cerrar.'), 900);
}
boot();
})();
</script>
